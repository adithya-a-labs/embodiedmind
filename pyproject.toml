[project]
name = "embodiedmind"
version = "0.1.0"
description = "Controlled MiniGrid experiments with evidence-grounded agent memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium==1.4.0",
  "matplotlib==3.11.2",
  "minigrid==3.2.0",
  "numpy==2.5.4",
  "pandas==3.1.1",
  "pyyaml==6.0.3",
]

[project.scripts]
embodiedmind = "embodiedmind.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
